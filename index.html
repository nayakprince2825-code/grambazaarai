<!DOCTYPE html>

<html lang="hi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GramBazaar (ग्रामबाज़ार) — शहडोल के प्रामाणिक स्थानीय उत्पाद</title>
<!-- Google Fonts: Hind & Poppins -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&amp;family=Poppins:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
    :root {
      --primary: #1e6b38;
      --primary-dark: #144926;
      --primary-light: #2e8b4e;
      --accent: #d97706;
      --accent-hover: #b45309;
      --cream-bg: #fcfbf7;
      --surface: #ffffff;
      --surface-subtle: #f4f1ea;
      --text-main: #1f2937;
      --text-muted: #526071;
      --border: #e2ddd3;
      --border-focus: #1e6b38;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(20,73,38,0.08);
      --shadow-lg: 0 10px 25px -3px rgba(20,73,38,0.12);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --whatsapp-green: #25D366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Hind', sans-serif;
      background-color: var(--cream-bg);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, .brand-font {
      font-family: 'Hind', sans-serif;
      font-weight: 700;
      color: #143520;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    .container {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    /* Top Announcement Bar */
    .top-bar {
      background: #143e22;
      color: #e5f6eb;
      font-size: 0.88rem;
      padding: 0.45rem 1rem;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      font-weight: 500;
    }
    .top-bar span {
      background: rgba(255,255,255,0.15);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    /* Header & Navigation */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }
    .nav-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.45rem;
      color: var(--primary-dark);
      font-weight: 700;
    }
    .brand-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #1e6b38, #2e8b4e);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.5rem;
      box-shadow: 0 4px 8px rgba(30,107,56,0.25);
    }
    .brand-subtext {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--accent);
      display: block;
      margin-top: -4px;
    }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 1.75rem;
    }
    .nav-link {
      font-size: 1.02rem;
      font-weight: 600;
      color: var(--text-main);
      transition: color 0.2s ease;
      position: relative;
      padding: 6px 0;
    }
    .nav-link:hover, .nav-link.active {
      color: var(--primary);
    }
    .nav-link:hover::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2.5px;
      background: var(--primary);
      border-radius: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .cart-trigger-btn {
      background: #f1f8f3;
      border: 1.5px solid #cce8d4;
      color: var(--primary-dark);
      padding: 8px 16px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .cart-trigger-btn:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .cart-badge {
      background: var(--accent);
      color: #fff;
      font-size: 0.8rem;
      border-radius: 50%;
      min-width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      font-weight: 700;
    }

    .mobile-menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 1.75rem;
      cursor: pointer;
      color: var(--primary-dark);
    }

    /* Mobile Drawer */
    .mobile-drawer {
      display: none;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 1rem 1.25rem 1.5rem;
      flex-direction: column;
      gap: 0.85rem;
    }
    .mobile-drawer.open {
      display: flex;
    }
    .mobile-nav-link {
      font-size: 1.05rem;
      font-weight: 600;
      padding: 8px 0;
      border-bottom: 1px solid #f0eee8;
    }

    /* Hero Section */
    .hero-section {
      background: linear-gradient(135deg, #f7f4ed 0%, #edf6ef 100%);
      padding: 3.5rem 0 4rem;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 3rem;
      align-items: center;
    }
    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #e4f3e9;
      color: var(--primary-dark);
      padding: 5px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
      border: 1px solid #c7e6d2;
    }
    .hero-title {
      font-size: 2.85rem;
      line-height: 1.25;
      margin-bottom: 1rem;
      color: #143e22;
    }
    .hero-desc {
      font-size: 1.2rem;
      color: var(--text-muted);
      margin-bottom: 1.85rem;
      max-width: 540px;
    }
    .hero-cta-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 26px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(30,107,56,0.3);
    }
    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: var(--surface);
      color: var(--primary-dark);
      border: 1.5px solid var(--primary);
    }
    .btn-secondary:hover {
      background: #eef7f1;
    }
    .hero-badges {
      display: flex;
      gap: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #dfd9cd;
    }
    .hero-badge-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      color: #2b4433;
      font-weight: 500;
    }
    .hero-badge-item span.icon {
      font-size: 1.3rem;
    }
    .hero-banner-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 1rem;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      position: relative;
    }
    .hero-img-wrap {
      width: 100%;
      height: 380px;
      border-radius: calc(var(--radius-lg) - 4px);
      overflow: hidden;
      position: relative;
      background: #e2ede5;
    }
    .hero-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero-floating-badge {
      position: absolute;
      bottom: -15px;
      left: 25px;
      background: #fff;
      border-radius: var(--radius-md);
      padding: 10px 18px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .hero-floating-badge .check-icon {
      width: 34px;
      height: 34px;
      background: #e2f6e9;
      color: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    /* Disclaimer Notice Banner */
    .notice-bar {
      background: #fff8e8;
      border-top: 1px solid #fae8c3;
      border-bottom: 1px solid #fae8c3;
      padding: 0.85rem 0;
      color: #8c5303;
      font-size: 0.95rem;
    }
    .notice-bar .container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Search & Filter Toolbar */
    .catalog-section {
      padding: 3.5rem 0 4rem;
    }
    .section-header {
      text-align: center;
      margin-bottom: 2.25rem;
    }
    .section-subtitle {
      color: var(--primary);
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .section-title {
      font-size: 2.2rem;
      color: #143e22;
    }
    .section-lead {
      color: var(--text-muted);
      max-width: 600px;
      margin: 8px auto 0;
      font-size: 1.05rem;
    }

    .search-filter-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      margin-bottom: 2rem;
    }
    .search-box-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .search-input-wrap {
      flex: 1;
      position: relative;
    }
    .search-input-wrap input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      font-size: 1rem;
      background: #fbfbf9;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input-wrap input:focus {
      border-color: var(--primary);
      background: #fff;
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      color: #7b8a9b;
    }

    .category-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .cat-btn {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .cat-btn:hover {
      background: #e8f3ec;
      border-color: #badcc5;
      color: var(--primary-dark);
    }
    .cat-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 2px 6px rgba(30,107,56,0.25);
    }

    /* Product Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 1.75rem;
    }

    .product-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: #c9e0d1;
    }
    .prod-img-container {
      width: 100%;
      height: 200px;
      position: relative;
      background: #f1ede4;
      overflow: hidden;
    }
    .prod-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .product-card:hover .prod-img-container img {
      transform: scale(1.04);
    }
    .prod-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(20, 62, 34, 0.88);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
      z-index: 2;
    }
    .prod-status-tag {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #e7f7ec;
      color: #145928;
      border: 1px solid #bce6c9;
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
      z-index: 2;
    }

    .prod-details {
      padding: 1.15rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .prod-category {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .prod-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: #143e22;
      line-height: 1.35;
      margin-bottom: 6px;
    }
    .prod-desc {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 12px;
      flex: 1;
    }
    .prod-pricing-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--border);
    }
    .prod-price {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--primary-dark);
    }
    .prod-unit {
      font-size: 0.88rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .prod-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .qty-control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #fbf9f4;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 4px 8px;
    }
    .qty-btn {
      width: 32px;
      height: 32px;
      background: #fff;
      border: 1px solid #d5cebf;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .qty-btn:hover {
      background: #edf7f0;
      border-color: var(--primary);
    }
    .qty-display {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-main);
      min-width: 28px;
      text-align: center;
    }

    .card-btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .btn-add-cart {
      background: #f0f7f2;
      border: 1.5px solid #bddfc7;
      color: var(--primary-dark);
      padding: 9px 8px;
      border-radius: var(--radius-sm);
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .btn-add-cart:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .btn-whatsapp-direct {
      background: #25D366;
      border: 1.5px solid #20ba5a;
      color: #fff;
      padding: 9px 8px;
      border-radius: var(--radius-sm);
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: background 0.2s;
    }
    .btn-whatsapp-direct:hover {
      background: #1eb857;
    }

    .no-results-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      background: #fff;
      border-radius: var(--radius-md);
      border: 1px dashed var(--border);
    }
    .no-results-state p {
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* How It Works Section */
    .how-it-works-section {
      background: #f3efe6;
      padding: 4rem 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .steps-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      margin-top: 2rem;
    }
    .step-card {
      background: var(--surface);
      padding: 2rem 1.5rem;
      border-radius: var(--radius-md);
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      position: relative;
    }
    .step-number {
      width: 48px;
      height: 48px;
      background: var(--primary);
      color: #fff;
      font-size: 1.3rem;
      font-weight: 700;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      box-shadow: 0 4px 8px rgba(30,107,56,0.3);
    }
    .step-title {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
    }
    .step-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* About & Story Section */
    .about-section {
      padding: 4.5rem 0;
      background: var(--surface);
    }
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3.5rem;
      align-items: center;
    }
    .about-content h2 {
      font-size: 2.2rem;
      margin-bottom: 1.25rem;
    }
    .about-content p {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 1.25rem;
    }
    .about-pillars {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      margin-top: 1.5rem;
    }
    .pillar-box {
      background: #f7f5ed;
      padding: 1.1rem;
      border-radius: var(--radius-sm);
      border-left: 4px solid var(--primary);
    }
    .pillar-box h4 {
      font-size: 1.05rem;
      margin-bottom: 4px;
      color: var(--primary-dark);
    }
    .pillar-box p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin: 0;
    }

    /* Suggestion & FAQ Section */
    .interactive-section {
      padding: 4rem 0;
      background: var(--cream-bg);
      border-top: 1px solid var(--border);
    }
    .interactive-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
    }

    .form-box {
      background: var(--surface);
      padding: 2rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.98rem;
      outline: none;
    }
    .form-group input:focus, .form-group textarea:focus {
      border-color: var(--primary);
    }
    .form-hint {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Accordion FAQ */
    .faq-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .faq-item {
      background: var(--surface);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .faq-question {
      padding: 1.1rem 1.25rem;
      font-weight: 700;
      font-size: 1.05rem;
      color: #143e22;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #faf8f2;
    }
    .faq-answer {
      padding: 1rem 1.25rem;
      font-size: 0.95rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      display: none;
      line-height: 1.6;
    }
    .faq-item.active .faq-answer {
